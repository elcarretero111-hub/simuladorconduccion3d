<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de conducción 3D</title>

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
            user-select: none;
        }

        /* ================= PANELES GENÉRICOS ================= */

        .panel {
            position: fixed;
            display: flex;
            align-items: center;
            gap: 12px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            padding: 10px 14px;
            border-radius: 10px;

            font-size: 15px;
            z-index: 10;
        }

        .panel-botones {
            display: flex;
            gap: 6px;
        }

        .panel button {
            width: 44px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1b1b1b;
            border: none;
            border-radius: 6px;

            color: #ffffff;
            cursor: pointer;
        }

        .panel button:hover {
            background: #2a2a2a;
        }

        /* Todos los iconos comparten el mismo ANCHO (24, como en Figma);
           el alto queda automático para no deformar coche/autobús */
        .panel button svg {
            width: 24px;
            height: auto;
            color: inherit;
            display: block;
        }

        /* Color "seleccionado" para las opciones de Vehículo / Orientación */
        .panel button.seleccionado {
            color: #707070;
            cursor: default;
        }

        .panel button.seleccionado:hover {
            background: #1b1b1b;
        }

        /* Botones de inclinación deshabilitados en los límites */
        .panel button.deshabilitado {
            opacity: 0.35;
            cursor: default;
        }

        .panel button.deshabilitado:hover {
            background: #1b1b1b;
        }

        /* ================= BOTÓN INICIO ================= */

        #btn-inicio {
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            cursor: default;
        }

        /* ================= VEHÍCULO ================= */

        #panel-vehiculo {
            top: 80px;
            left: 20px;
        }

        /* ================= CÁMARA (INCLINAR / ORIENTACIÓN) ================= */

        #panel-inclinar {
            top: 20px;
            right: 20px;
        }

        #panel-orientacion {
            top: 80px;
            right: 20px;
        }

        /* ================= FUNCIONES DEL VEHÍCULO ================= */

        #panel-funciones {
            bottom: 30px;
            left: 20px;
        }

        /* Colores de estado activo para las funciones del vehículo
           (mismos valores hexadecimales que traen tus SVG originales) */
        .color-verde.activo   { color: #00A000; }
        .color-azul.activo    { color: #0000FF; }
        .color-rojo.activo    { color: #CF0000; }

        /* ================= VELOCÍMETRO ================= */

        #velocimetro {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.75);
            color: #7CFC00;

            padding: 12px 25px;
            border-radius: 8px;

            font-size: 24px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;

            z-index: 10;
        }
    </style>
</head>

    <!-- Three.js -->
    <script type="module">

        import * as THREE from
        'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


        // ==========================================
        // 0. MAPBOX
        //
        // El coche ya NO se dibuja con una cámara de Three.js aparte: se
        // dibuja usando la MISMA cámara que usa Mapbox para el satélite.
        // Así, coche y mapa están siempre perfectamente alineados y con la
        // misma perspectiva (nunca "descuadran" ni cambian de tamaño raro).
        // ==========================================

        mapboxgl.accessToken = 'MAPBOX_TOKEN_PLACEHOLDER';

        // Punto de partida en el mapa (cámbialo por donde quieras conducir)
        const origenMapa = { lng: -3.6843, lat: 40.4168 };

        const mapaMapbox = new mapboxgl.Map({
            container: 'mapbox-container',
            style: 'mapbox://styles/mapbox/satellite-v9',
            center: [origenMapa.lng, origenMapa.lat],
            zoom: 19,
            pitch: 60,
            bearing: 0,
            interactive: false, // el usuario controla el coche, no el mapa
            antialias: true     // suaviza los bordes del coche 3D
        });

        // Coordenadas internas ("mercator") del punto de partida, y cuántas
        // de esas unidades equivalen a 1 metro justo ahí.
        const origenMercator = mapboxgl.MercatorCoordinate.fromLngLat(
            [origenMapa.lng, origenMapa.lat],
            0
        );
        const escalaMetros = origenMercator.meterInMercatorCoordinateUnits();

        // Convierte un punto de Three.js en metros (x = este, z = sur, y = altura)
        // a una coordenada real del mapa. Se usa tanto para dibujar el coche
        // como para colocar la cámara: al usar SIEMPRE esta misma fórmula,
        // coche y mapa nunca se pueden desincronizar entre sí.
        function metrosAMercator(punto) {
            return new mapboxgl.MercatorCoordinate(
                origenMercator.x + punto.x * escalaMetros,
                origenMercator.y + punto.z * escalaMetros,
                origenMercator.z + punto.y * escalaMetros
            );
        }

        // Matriz fija (se calcula una sola vez) que "ancla" el mundo de
        // Three.js —en metros— al punto de partida real del mapa.
        const matrizAnclaje = new THREE.Matrix4()
            .makeTranslation(origenMercator.x, origenMercator.y, origenMercator.z)
            .scale(new THREE.Vector3(escalaMetros, -escalaMetros, escalaMetros))
            .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));


        // ==========================================
        // 0B. CAPA QUE FUSIONA EL COCHE 3D CON LA CÁMARA DE MAPBOX
        // ==========================================

        const capaVehiculo3D = {
            id: 'capa-vehiculo-3d',
            type: 'custom',
            renderingMode: '3d',

            onAdd(map, gl) {
                this.camaraCapa = new THREE.Camera();
                this.renderer = new THREE.WebGLRenderer({
                    canvas: map.getCanvas(),
                    context: gl,
                    antialias: true
                });
                this.renderer.autoClear = false;
            },

            render(gl, matrix) {
                const matrizCamaraMapa = new THREE.Matrix4().fromArray(matrix);
                this.camaraCapa.projectionMatrix = matrizCamaraMapa.multiply(matrizAnclaje);
                this.renderer.resetState();
                this.renderer.render(escena, this.camaraCapa);
            }
        };


        // ==========================================
        // 1. CREAR EL MUNDO
        // ==========================================

        const escena = new THREE.Scene();

        // Sin color de fondo: así se ve el mapa satelital de Mapbox de detrás
        // escena.background = new THREE.Color(0x87ceeb);


        // (Ya no hace falta una cámara ni un renderizador propios de Three.js:
        // los dibuja todo la capa "capaVehiculo3D" de más arriba, usando la
        // cámara real de Mapbox.)


        // ==========================================
        // 4. ILUMINACIÓN
        // ==========================================

        const luz = new THREE.DirectionalLight(0xffffff, 2);
        luz.position.set(50, 100, 50);
        escena.add(luz);

        const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.5);
        escena.add(luzAmbiente);


        // (Ya no hay un "suelo" gris de Three.js: la carretera es directamente
        // la imagen satelital de Mapbox, vista con la misma cámara que el coche.)


        // ==========================================
        // 6. VEHÍCULOS (coche y autobús geométricamente simples)
        // ==========================================

        // --- Materiales de las luces, compartidos y actualizados cada frame ---

        function crearMaterialLuz(colorApagado, colorEncendido) {
            const material = new THREE.MeshStandardMaterial({
                color: colorApagado,
                emissive: colorApagado,
                emissiveIntensity: 0.3
            });
            material.userData = { colorApagado, colorEncendido };
            return material;
        }

        function encenderLuz(material, encendida, intensidad = 2.5) {
            const { colorApagado, colorEncendido } = material.userData;
            material.color.set(encendida ? colorEncendido : colorApagado);
            material.emissive.set(encendida ? colorEncendido : colorApagado);
            material.emissiveIntensity = encendida ? intensidad : 0.25;
        }

        function anadirLucesA(grupo, semiAncho, zFrontal, zTrasera, altoLuces) {

            const matFaro = crearMaterialLuz(0xdddddd, 0xffffff);
            const matIntermitenteFrontalIzq = crearMaterialLuz(0x553300, 0xffa500);
            const matIntermitenteFrontalDer = crearMaterialLuz(0x553300, 0xffa500);
            const matIntermitenteTraseroIzq = crearMaterialLuz(0x553300, 0xffa500);
            const matIntermitenteTraseroDer = crearMaterialLuz(0x553300, 0xffa500);
            const matFreno = crearMaterialLuz(0x550000, 0xff0000);

            const geoFaro = new THREE.BoxGeometry(0.32, 0.16, 0.06);
            const geoIntermitente = new THREE.BoxGeometry(0.18, 0.14, 0.06);
            const geoFreno = new THREE.BoxGeometry(0.32, 0.16, 0.06);

            const faroIzq = new THREE.Mesh(geoFaro, matFaro);
            faroIzq.position.set(-semiAncho * 0.65, altoLuces, zFrontal);
            grupo.add(faroIzq);

            const faroDer = new THREE.Mesh(geoFaro, matFaro.clone());
            faroDer.position.set(semiAncho * 0.65, altoLuces, zFrontal);
            grupo.add(faroDer);

            const intermitenteFrontalIzq = new THREE.Mesh(geoIntermitente, matIntermitenteFrontalIzq);
            intermitenteFrontalIzq.position.set(-semiAncho * 0.92, altoLuces, zFrontal);
            grupo.add(intermitenteFrontalIzq);

            const intermitenteFrontalDer = new THREE.Mesh(geoIntermitente, matIntermitenteFrontalDer);
            intermitenteFrontalDer.position.set(semiAncho * 0.92, altoLuces, zFrontal);
            grupo.add(intermitenteFrontalDer);

            const intermitenteTraseroIzq = new THREE.Mesh(geoIntermitente, matIntermitenteTraseroIzq);
            intermitenteTraseroIzq.position.set(-semiAncho * 0.92, altoLuces, zTrasera);
            grupo.add(intermitenteTraseroIzq);

            const intermitenteTraseroDer = new THREE.Mesh(geoIntermitente, matIntermitenteTraseroDer);
            intermitenteTraseroDer.position.set(semiAncho * 0.92, altoLuces, zTrasera);
            grupo.add(intermitenteTraseroDer);

            const frenoIzq = new THREE.Mesh(geoFreno, matFreno);
            frenoIzq.position.set(-semiAncho * 0.65, altoLuces, zTrasera);
            grupo.add(frenoIzq);

            const frenoDer = new THREE.Mesh(geoFreno, matFreno.clone());
            frenoDer.position.set(semiAncho * 0.65, altoLuces, zTrasera);
            grupo.add(frenoDer);

            return {
                faros: [matFaro, faroDer.material],
                intermitentesIzq: [matIntermitenteFrontalIzq, matIntermitenteTraseroIzq],
                intermitentesDer: [matIntermitenteFrontalDer, matIntermitenteTraseroDer],
                freno: [matFreno, frenoDer.material]
            };
        }

        // --- Coche ---

        function crearCoche() {
            const grupo = new THREE.Group();

            const carroceria = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.7, 4),
                new THREE.MeshStandardMaterial({ color: 0xff0000 })
            );
            carroceria.position.y = 0.6;
            grupo.add(carroceria);

            const techo = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.5, 2),
                new THREE.MeshStandardMaterial({ color: 0x222222 })
            );
            techo.position.y = 1.15;
            grupo.add(techo);

            const luces = anadirLucesA(grupo, 1, -2.02, 2.02, 0.55);

            return { grupo, luces };
        }

        // --- Autobús (alargado, mismo ancho que el coche) ---

        function crearAutobus() {
            const grupo = new THREE.Group();

            const carroceria = new THREE.Mesh(
                new THREE.BoxGeometry(2, 2.2, 9),
                new THREE.MeshStandardMaterial({ color: 0x1e6fd9 })
            );
            carroceria.position.y = 1.3;
            grupo.add(carroceria);

            const bandaVentanas = new THREE.Mesh(
                new THREE.BoxGeometry(2.02, 0.6, 8.4),
                new THREE.MeshStandardMaterial({ color: 0x9fd3ff })
            );
            bandaVentanas.position.y = 1.9;
            grupo.add(bandaVentanas);

            const luces = anadirLucesA(grupo, 1, -4.52, 4.52, 1.1);

            return { grupo, luces };
        }

        // --- Grupo contenedor: representa la posición/rotación real del vehículo ---

        const vehiculo = new THREE.Group();
        escena.add(vehiculo);

        const objetoCoche = crearCoche();
        const objetoAutobus = crearAutobus();

        objetoAutobus.grupo.visible = false;

        vehiculo.add(objetoCoche.grupo);
        vehiculo.add(objetoAutobus.grupo);

        let tipoVehiculo = "coche"; // "coche" | "autobus"
        let lucesActivas = objetoCoche.luces;


        // ==========================================
        // 7. CONTROLES DE TECLADO
        // ==========================================

        const teclas = {};

        window.addEventListener("keydown", (evento) => {
            const tecla = evento.key.toLowerCase();

            if (tecla === " ") evento.preventDefault();

            teclas[tecla] = true;

            if (tecla === "z") alternarIntermitente("izquierdo");
            if (tecla === "x") alternarIntermitente("derecho");
            if (tecla === "c") alternarEmergencia();
            if (tecla === "v") alternarLuces("largas");
            if (tecla === "b") alternarLuces("cortas");
            if (tecla === "n") tocarClaxon();
        });

        window.addEventListener("keyup", (evento) => {
            teclas[evento.key.toLowerCase()] = false;
        });


        // ==========================================
        // 8. ESTADO DEL VEHÍCULO: PERFIL FÍSICO
        // ==========================================

        const perfiles = {
            coche:   { aceleracion: 10, frenado: 16, manoFreno: 22, velocidadMaxima: 40, velocidadMaximaReversa: 15, giro: 1.9 },
            autobus: { aceleracion: 5,  frenado: 9,  manoFreno: 16, velocidadMaxima: 22, velocidadMaximaReversa: 8,  giro: 1.1 }
        };

        let velocidad = 0; // metros/segundo, puede ser negativo (marcha atrás)


        // ==========================================
        // 9. FUNCIONES / LUCES DEL VEHÍCULO
        // ==========================================

        let estadoIntermitente = "ninguno"; // "ninguno" | "izquierdo" | "derecho" | "emergencia"
        let estadoLuces = "apagado";        // "apagado" | "cortas" | "largas"

        function alternarIntermitente(lado) {
            estadoIntermitente = estadoIntermitente === lado ? "ninguno" : lado;
            sincronizarBotonesFunciones();
        }

        function alternarEmergencia() {
            estadoIntermitente = estadoIntermitente === "emergencia" ? "ninguno" : "emergencia";
            sincronizarBotonesFunciones();
        }

        function alternarLuces(tipo) {
            estadoLuces = estadoLuces === tipo ? "apagado" : tipo;
            sincronizarBotonesFunciones();
        }

        // Preparado para cuando exista sonido: de momento solo deja constancia de la acción.
        function tocarClaxon() {
            console.log("Claxon: aquí se reproducirá el sonido cuando se implemente sonido.js");
        }

        function sincronizarBotonesFunciones() {
            document.getElementById("btn-intermitente-izq").classList.toggle(
                "activo", estadoIntermitente === "izquierdo" || estadoIntermitente === "emergencia"
            );
            document.getElementById("btn-intermitente-der").classList.toggle(
                "activo", estadoIntermitente === "derecho" || estadoIntermitente === "emergencia"
            );
            document.getElementById("btn-emergencia").classList.toggle(
                "activo", estadoIntermitente === "emergencia"
            );
            // Los botones de faros largos/cortos ya no están en la interfaz,
            // pero las teclas V/B (más abajo) siguen encendiendo las luces igualmente.
        }


        // ==========================================
        // 10. SELECTOR DE VEHÍCULO
        // ==========================================

        const btnVehiculoCoche = document.getElementById("btn-vehiculo-coche");
        const btnVehiculoAutobus = document.getElementById("btn-vehiculo-autobus");

        function elegirVehiculo(tipo) {
            tipoVehiculo = tipo;

            objetoCoche.grupo.visible = tipo === "coche";
            objetoAutobus.grupo.visible = tipo === "autobus";
            lucesActivas = tipo === "coche" ? objetoCoche.luces : objetoAutobus.luces;

            velocidad = 0;

            btnVehiculoCoche.classList.toggle("seleccionado", tipo === "coche");
            btnVehiculoAutobus.classList.toggle("seleccionado", tipo === "autobus");
        }

        btnVehiculoCoche.addEventListener("click", () => elegirVehiculo("coche"));
        btnVehiculoAutobus.addEventListener("click", () => elegirVehiculo("autobus"));

        elegirVehiculo("coche"); // selección por defecto


        // ==========================================
        // 11. INCLINACIÓN DE CÁMARA (3 niveles)
        // ==========================================

        const nivelesInclinacion = [
            { altura: 5,  distancia: 9   }, // baja: como se ve ahora
            { altura: 12, distancia: 6.5 }, // media
            { altura: 24, distancia: 1.2 }  // alta: casi vertical, vista "2D" desde el aire
        ];

        let nivelInclinacion = 0;

        const btnInclinarAbajo = document.getElementById("btn-inclinar-abajo");
        const btnInclinarArriba = document.getElementById("btn-inclinar-arriba");

        function actualizarBotonesInclinacion() {
            btnInclinarAbajo.classList.toggle("deshabilitado", nivelInclinacion === 0);
            btnInclinarArriba.classList.toggle("deshabilitado", nivelInclinacion === nivelesInclinacion.length - 1);
        }

        btnInclinarAbajo.addEventListener("click", () => {
            nivelInclinacion = Math.max(0, nivelInclinacion - 1);
            actualizarBotonesInclinacion();
        });

        btnInclinarArriba.addEventListener("click", () => {
            nivelInclinacion = Math.min(nivelesInclinacion.length - 1, nivelInclinacion + 1);
            actualizarBotonesInclinacion();
        });

        actualizarBotonesInclinacion();


        // ==========================================
        // 12. ORIENTACIÓN DE CÁMARA
        // ==========================================

        let orientacionCamara = "norte"; // "norte" | "vehiculo"

        const btnOrientacionNorte = document.getElementById("btn-orientacion-norte");
        const btnOrientacionVehiculo = document.getElementById("btn-orientacion-vehiculo");

        function elegirOrientacion(modo) {
            orientacionCamara = modo;
            btnOrientacionNorte.classList.toggle("seleccionado", modo === "norte");
            btnOrientacionVehiculo.classList.toggle("seleccionado", modo === "vehiculo");
        }

        btnOrientacionNorte.addEventListener("click", () => elegirOrientacion("norte"));
        btnOrientacionVehiculo.addEventListener("click", () => elegirOrientacion("vehiculo"));

        elegirOrientacion("norte"); // selección por defecto


        // ==========================================
        // 13. BOTONES DE FUNCIONES (también clicables, no solo teclado)
        // ==========================================

        document.getElementById("btn-intermitente-izq").addEventListener("click", () => alternarIntermitente("izquierdo"));
        document.getElementById("btn-intermitente-der").addEventListener("click", () => alternarIntermitente("derecho"));
        document.getElementById("btn-emergencia").addEventListener("click", alternarEmergencia);
        document.getElementById("btn-claxon").addEventListener("click", tocarClaxon);


        // ==========================================
        // 14. RELOJ
        // ==========================================

        const reloj = new THREE.Clock();

        let tiempoTotal = 0;

        // Posición de la cámara, en metros relativos al origen del mapa,
        // suavizada frame a frame (evita que la cámara "salte")
        let posicionCamaraSuave = new THREE.Vector3(
            0,
            nivelesInclinacion[0].altura,
            nivelesInclinacion[0].distancia
        );


        // ==========================================
        // 15. BUCLE PRINCIPAL
        // ==========================================

        function animar() {

            requestAnimationFrame(animar);

            const delta = reloj.getDelta();
            tiempoTotal += delta;

            const perfil = perfiles[tipoVehiculo];


            // --------------------------
            // ACELERAR / FRENAR / RETROCEDER / FRENO DE MANO
            // --------------------------

            const acelerar = teclas["w"] || teclas["arrowup"];
            const frenarORetroceder = teclas["s"] || teclas["arrowdown"];
            const frenoDeManoActivo = teclas[" "];

            if (frenoDeManoActivo) {

                if (velocidad > 0) velocidad = Math.max(0, velocidad - perfil.manoFreno * delta);
                else if (velocidad < 0) velocidad = Math.min(0, velocidad + perfil.manoFreno * delta);

            } else if (acelerar) {

                velocidad += perfil.aceleracion * delta;

            } else if (frenarORetroceder) {

                if (velocidad > 0) {
                    velocidad -= perfil.frenado * delta; // frenando
                } else {
                    velocidad -= perfil.aceleracion * delta; // acelerando marcha atrás
                }

            } else {

                velocidad *= 0.98; // rozamiento natural

                if (Math.abs(velocidad) < 0.05) velocidad = 0;
            }

            velocidad = Math.max(-perfil.velocidadMaximaReversa, Math.min(velocidad, perfil.velocidadMaxima));


            // --------------------------
            // GIRAR
            // --------------------------

            if (teclas["a"] || teclas["arrowleft"]) vehiculo.rotation.y += perfil.giro * delta;
            if (teclas["d"] || teclas["arrowright"]) vehiculo.rotation.y -= perfil.giro * delta;


            // --------------------------
            // AVANZAR / RETROCEDER
            // --------------------------

            vehiculo.translateZ(-velocidad * delta);


            // --------------------------
            // CÁMARA (ahora es la cámara real de Mapbox, no una de Three.js)
            // --------------------------

            const { altura, distancia } = nivelesInclinacion[nivelInclinacion];

            let posicionCamaraObjetivo;

            if (orientacionCamara === "vehiculo") {
                posicionCamaraObjetivo = new THREE.Vector3(0, altura, distancia);
                posicionCamaraObjetivo.applyQuaternion(vehiculo.quaternion);
                posicionCamaraObjetivo.add(vehiculo.position);
            } else {
                posicionCamaraObjetivo = vehiculo.position.clone().add(new THREE.Vector3(0, altura, distancia));
            }

            posicionCamaraSuave.lerp(posicionCamaraObjetivo, 0.12);

            const camaraLibre = mapaMapbox.getFreeCameraOptions();
            camaraLibre.position = metrosAMercator(posicionCamaraSuave);

            const objetivoMercator = metrosAMercator(vehiculo.position);
            camaraLibre.lookAtPoint(objetivoMercator.toLngLat(), [0, 0, 1]);

            mapaMapbox.setFreeCameraOptions(camaraLibre);


            // --------------------------
            // LUCES DEL VEHÍCULO ACTIVO
            // --------------------------

            const parpadeoEncendido = Math.floor(tiempoTotal / 0.5) % 2 === 0;

            const intermitenteIzqEncendido = (estadoIntermitente === "izquierdo" || estadoIntermitente === "emergencia") && parpadeoEncendido;
            const intermitenteDerEncendido = (estadoIntermitente === "derecho" || estadoIntermitente === "emergencia") && parpadeoEncendido;
            const frenandoOMarchaAtras = frenarORetroceder || frenoDeManoActivo;

            lucesActivas.intermitentesIzq.forEach((m) => encenderLuz(m, intermitenteIzqEncendido));
            lucesActivas.intermitentesDer.forEach((m) => encenderLuz(m, intermitenteDerEncendido));
            lucesActivas.freno.forEach((m) => encenderLuz(m, frenandoOMarchaAtras));

            // Un mismo faro cambia de tono según esté apagado, en corto o en largo
            lucesActivas.faros.forEach((m) => {
                if (estadoLuces === "cortas") {
                    m.color.set(0xffffff);
                    m.emissive.set(0xffffff);
                    m.emissiveIntensity = 1.2;
                } else if (estadoLuces === "largas") {
                    m.color.set(0x8fb8ff);
                    m.emissive.set(0x8fb8ff);
                    m.emissiveIntensity = 2.8;
                } else {
                    m.color.set(0xdddddd);
                    m.emissive.set(0xdddddd);
                    m.emissiveIntensity = 0.25;
                }
            });


            // --------------------------
            // VELOCÍMETRO
            // --------------------------

            const velocidadKmH = Math.round(Math.abs(velocidad) * 3.6);

            document.getElementById("velocimetro").textContent =
                velocidadKmH + " km/h" + (velocidad < -0.1 ? " (R)" : "");


            // --------------------------
            // DIBUJAR (le pedimos a Mapbox que repinte; eso llama automáticamente
            // a "render" dentro de capaVehiculo3D, definida más arriba)
            // --------------------------

            mapaMapbox.triggerRepaint();
        }

        // Esperamos a que el mapa esté listo antes de añadir el coche y arrancar
        mapaMapbox.on('load', () => {
            mapaMapbox.addLayer(capaVehiculo3D);
            animar();
        });


        // ==========================================
        // 16. CAMBIO DE TAMAÑO
        // ==========================================

        window.addEventListener("resize", () => {
            mapaMapbox.resize();
        });

    </script>

</body>
